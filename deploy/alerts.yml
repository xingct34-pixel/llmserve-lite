# LLMServe-Lite 本地推理服务 | deploy/alerts.yml
# 功能：Prometheus 载入这组规则后，定时判断 HTTP 429 是否增长、队列是否持续有积压。
# 表达式描述“发生了什么”，for 指定条件持续多久才进入告警状态。
# 目的：把零散的指标样本变成有持续时间要求的告警，便于区分短暂波动和持续积压。


# 模块：告警示例
# 功能：请求拒绝与队列积压分别提示，阈值须根据实际负载调整
groups:
  - name: llmserve
    rules:


      # 请求被拒
      # 在最近 5 分钟的窗口看 429 计数增量；for 表示条件还需持续一段时间才进入 firing。
      # [5m] 是回看计数器的窗口，for: 1m 是条件要持续成立的时间。一条 429 可以使“过去 5 分钟有过拒绝”持续为真，并不要求每分钟都再发生一次。
      - alert: LLMServeRequestsRejected
        expr: increase(llmserve_http_status_429_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LLMServe-Lite observed rejected requests"


      # 持续积压
      # 队列曾经非空不等于持续拥堵。这里要求连续 2 分钟仍符合条件。
      - alert: LLMServeQueueBacklog
        expr: llmserve_queue_depth > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLMServe-Lite queue remains nonempty"
