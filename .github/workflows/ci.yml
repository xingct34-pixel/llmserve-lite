# LLMServe-Lite 本地推理服务 | .github/workflows/ci.yml
# 功能：GitHub 在 Linux 上跑应用层的 mock 和 sanitize 预设，实际步骤交给 scripts/check.sh。
# 这些作业能检查服务逻辑以及部分内存错误，真实模型走单独的 CPU 工作流。
# 目的：使每次提交都能用模拟后端快速回归服务逻辑和内存错误，无需为普通检查准备权重。


name: CPU application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15


    # 测试矩阵
    # 同一份源码分成 mock 和 sanitize 两次任务；后者额外检查某些内存或未定义行为。
    # mock 和 sanitize 是同一份提交的两次构建。前者查功能，后者让内存或未定义行为错误更容易暴露；矩阵里没有 cpu，真实权重的验收另有入口。
    strategy:
      matrix:
        preset: [mock, sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test without weights or network dependency fetches
        run: bash scripts/check.sh ${{ matrix.preset }}
