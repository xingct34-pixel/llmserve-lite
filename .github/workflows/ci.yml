name: CPU application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [mock, sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test without weights or network dependency fetches
        run: bash scripts/check.sh ${{ matrix.preset }}
