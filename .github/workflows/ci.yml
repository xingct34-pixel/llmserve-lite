# LLMServe-Lite 本地推理服务 | .github/workflows/ci.yml
# GitHub 在 Linux 上跑应用层的 mock 和 sanitize 预设，实际步骤交给 scripts/check.sh。
# 这些作业能检查服务逻辑以及部分内存错误，真实模型走单独的 CPU 工作流。


name: CPU application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [mock, sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test without weights or network dependency fetches
        run: bash scripts/check.sh ${{ matrix.preset }}
